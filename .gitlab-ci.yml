# Equivalente GitLab CI do workflow .github/workflows/ci.yml: mesmas etapas, mesmos scripts.
# O repositório está no GitHub, então este arquivo ainda não foi executado num runner do GitLab.
#
# Variáveis a criar em Settings > CI/CD > Variables (mascaradas):
#   GROQ_API_KEY       chave da API do Groq usada pelo agente de diagnóstico
#   GITLAB_API_TOKEN   token de projeto com escopo `api`, para comentar no Merge Request

stages:
  - qualidade
  - teste
  - diagnostico

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

default:
  image: node:22-bookworm
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline
    - cp src/environments/environment.example.ts src/environments/environment.ts

qualidade:
  stage: qualidade
  script:
    - npm run lint
    - npm run format:check
    - npm run test:agente
    - npm run build:prod

testes:
  stage: teste
  needs: []
  variables:
    CHROME_BIN: /usr/bin/chromium
    KARMA_RESULTADOS_JSON: reports/karma-resultados.json
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends chromium
    - node scripts/ci/coletar-ambiente.mjs reports/ambiente.json
    # `comando | tee` devolve o código de saída do tee; o do Karma é lido de PIPESTATUS.
    - |
      set +e
      npm run test:ci 2>&1 | tee reports/karma.log
      codigo_karma=${PIPESTATUS[0]}
      set -e
    - node scripts/ci/avaliar-testes.mjs --codigo-karma "$codigo_karma"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - reports/
      - coverage/

diagnostico_ia:
  stage: diagnostico
  needs:
    - job: testes
      artifacts: true
  # Só roda quando o job de testes falha. Não altera o resultado do pipeline.
  when: on_failure
  allow_failure: true
  cache: []
  variables:
    GIT_DEPTH: 0
    DIAG_COMPARAR_SEM_AMBIENTE: 'true'
  before_script: []
  script:
    - export DIAG_BASE_SHA="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-$CI_COMMIT_BEFORE_SHA}"
    - node scripts/ia/diagnosticar-falha.mjs
    - if [ -f reports/diagnostico/diagnostico.md ]; then cat reports/diagnostico/diagnostico.md; fi
    - |
      if [ -f reports/diagnostico/diagnostico.md ] && [ -n "$GITLAB_API_TOKEN" ] && [ -n "$CI_MERGE_REQUEST_IID" ]; then
        curl --silent --show-error --fail --request POST \
          --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" \
          --form "body=<reports/diagnostico/diagnostico.md" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes" > /dev/null
        echo "Diagnóstico publicado no Merge Request !$CI_MERGE_REQUEST_IID."
      fi
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - reports/diagnostico/
