services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: dashboard-clima:latest
    container_name: dashboard-clima
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - clima-net

networks:
  clima-net:
    driver: bridge
